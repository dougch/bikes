<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <style>
      .part { fill:#e7e2d7; stroke:#555; stroke-width:2; }
      .bearing { fill:#cfc8b8; stroke:#555; stroke-width:2; }
      .frame { fill:#dcd7cc; stroke:#4a4a4a; stroke-width:2.5; }
      .collar { fill:#b4451f; stroke:#7c2f14; stroke-width:2; }
      .spindle { fill:#ddd8cc; stroke:#555; stroke-width:2; }
      .thread { stroke:#8a8375; stroke-width:1.4; }
      .center { stroke:#9c948333; stroke-width:1.5; stroke-dasharray:8 6; }
      .lead { stroke:#8a8375; stroke-width:1.4; }
      .num { fill:#b4451f; }
      .numtxt { fill:#f4f1ec; font-size:15px; font-weight:700; text-anchor:middle; }
      .etch { fill:#6b6459; font-size:13px; letter-spacing:1px; text-anchor:middle; }
      .side { fill:#6b6459; font-size:12px; letter-spacing:2px; }
    </style>
  </defs>

  <line class="center" x1="24" y1="190" x2="900" y2="190"/>
  <text class="side" x="24" y="34">NON-DRIVE / LEFT</text>
  <text class="side" x="900" y="34" text-anchor="end">DRIVE / RIGHT</text>

  <!-- 1 left crank arm -->
  <rect class="part" x="40" y="112" width="26" height="156" rx="9"/>
  <circle class="part" cx="53" cy="286" r="12"/>

  <!-- 2 self-extracting crank bolt -->
  <path class="part" d="M92 190a14 14 0 1 1 28 0a14 14 0 1 1 -28 0z"/>
  <rect class="part" x="106" y="181" width="40" height="18" rx="3"/>

  <!-- 3 preload adjuster collar + 4 clamp screw -->
  <rect x="188" y="150" width="34" height="80" class="collar"/>
  <ellipse cx="188" cy="190" rx="12" ry="40" class="collar"/>
  <ellipse cx="222" cy="190" rx="12" ry="40" fill="#c9552c" stroke="#7c2f14" stroke-width="2"/>
  <rect x="199" y="132" width="11" height="20" class="part"/>
  <circle cx="204.5" cy="129" r="6" class="part"/>

  <!-- 5 non-drive bearing + cup -->
  <rect class="part" x="258" y="140" width="44" height="100"/>
  <ellipse class="part" cx="258" cy="190" rx="13" ry="50"/>
  <ellipse class="bearing" cx="302" cy="190" rx="13" ry="50"/>
  <ellipse class="bearing" cx="302" cy="190" rx="8" ry="30"/>
  <line class="thread" x1="262" y1="142" x2="298" y2="142"/>
  <line class="thread" x1="262" y1="150" x2="298" y2="150"/>
  <line class="thread" x1="262" y1="238" x2="298" y2="238"/>
  <line class="thread" x1="262" y1="230" x2="298" y2="230"/>

  <!-- 6 T47 frame shell -->
  <rect class="frame" x="352" y="120" width="150" height="140"/>
  <ellipse class="frame" cx="352" cy="190" rx="17" ry="70"/>
  <ellipse cx="352" cy="190" rx="9" ry="42" fill="#c7c1b4" stroke="#4a4a4a" stroke-width="2"/>
  <ellipse cx="502" cy="190" rx="9" ry="42" fill="#cfc9bc" stroke="#4a4a4a" stroke-width="2"/>
  <path d="M427 120l-10 -14M448 120l-10 -14M427 260l-10 14M448 260l-10 14" stroke="#4a4a4a" stroke-width="2" fill="none"/>
  <text class="etch" x="427" y="196">T47 SHELL — FRAME</text>
  <text class="etch" x="427" y="214">M47×1.0 · 77mm</text>

  <!-- 5b drive-side bearing + cup -->
  <rect class="part" x="520" y="140" width="44" height="100"/>
  <ellipse class="bearing" cx="520" cy="190" rx="13" ry="50"/>
  <ellipse class="bearing" cx="520" cy="190" rx="8" ry="30"/>
  <ellipse class="part" cx="564" cy="190" rx="13" ry="50"/>
  <line class="thread" x1="524" y1="142" x2="560" y2="142"/>
  <line class="thread" x1="524" y1="150" x2="560" y2="150"/>
  <line class="thread" x1="524" y1="238" x2="560" y2="238"/>
  <line class="thread" x1="524" y1="230" x2="560" y2="230"/>
  <text class="etch" x="542" y="300">reverse (LH) thread</text>

  <!-- 7 DUB spindle (attached to drive crank) -->
  <rect class="spindle" x="580" y="172" width="140" height="36"/>
  <ellipse class="spindle" cx="580" cy="190" rx="10" ry="18"/>

  <!-- 8 drive crank arm + spider + 40T chainring -->
  <circle cx="782" cy="190" r="92" fill="none" stroke="#555" stroke-width="2.5"/>
  <g stroke="#7d7565" stroke-width="3">
    <line x1="782" y1="98" x2="782" y2="90"/><line x1="838" y1="112" x2="843" y2="106"/>
    <line x1="874" y1="190" x2="882" y2="190"/><line x1="838" y1="268" x2="843" y2="274"/>
    <line x1="782" y1="282" x2="782" y2="290"/><line x1="726" y1="268" x2="721" y2="274"/>
    <line x1="690" y1="190" x2="682" y2="190"/><line x1="726" y1="112" x2="721" y2="106"/>
  </g>
  <g fill="#e7e2d7" stroke="#555" stroke-width="1.6">
    <circle cx="782" cy="138" r="5"/><circle cx="819" cy="153" r="5"/><circle cx="834" cy="190" r="5"/>
    <circle cx="819" cy="227" r="5"/><circle cx="782" cy="242" r="5"/><circle cx="745" cy="227" r="5"/>
    <circle cx="730" cy="190" r="5"/><circle cx="745" cy="153" r="5"/>
  </g>
  <circle class="part" cx="782" cy="190" r="20"/>
  <rect class="part" x="769" y="112" width="26" height="156" rx="9"/>
  <circle class="part" cx="782" cy="286" r="12"/>

  <!-- callouts -->
  <g class="lead" fill="none">
    <path d="M53 96 V70"/><path d="M106 214 V250"/>
    <path d="M170 150 L170 96"/><path d="M245 129 L266 96"/>
    <path d="M300 240 L300 300 L285 300"/><path d="M545 190 L545 210"/>
    <path d="M427 260 L427 320"/><path d="M650 208 L650 300"/>
    <path d="M782 282 L782 340"/>
  </g>
  <g>
    <circle class="num" cx="53" cy="56" r="14"/><text class="numtxt" x="53" y="61">1</text>
    <circle class="num" cx="106" cy="264" r="14"/><text class="numtxt" x="106" y="269">2</text>
    <circle class="num" cx="170" cy="82" r="14"/><text class="numtxt" x="170" y="87">3</text>
    <circle class="num" cx="245" cy="82" r="14"/><text class="numtxt" x="245" y="87">4</text>
    <circle class="num" cx="285" cy="314" r="14"/><text class="numtxt" x="285" y="319">5</text>
    <circle class="num" cx="427" cy="334" r="14"/><text class="numtxt" x="427" y="339">6</text>
    <circle class="num" cx="650" cy="314" r="14"/><text class="numtxt" x="650" y="319">7</text>
    <circle class="num" cx="782" cy="354" r="14"/><text class="numtxt" x="782" y="359">8</text>
  </g>

  <text class="etch" x="470" y="410" text-anchor="middle">Schematic — SRAM DUB crank + T47 threaded BB (exploded, non-drive at left). Not to scale.</text>
</svg>
